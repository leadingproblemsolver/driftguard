name: Product Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Pin repository-declared npm version
        run: npm install --global npm@11.19.0
      - name: Verify toolchain and supply-chain policy
        run: |
          node --version
          npm --version
          test "$(npm config get min-release-age)" = "7"
      - name: Normalize portable lock registry
        run: node ./scripts/normalize-lock-registry.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full repository validation
        run: npm run validate
      - name: Audit production dependencies
        run: npm audit --omit=dev
