name: Product Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Pin repository-declared npm version
        run: npm install --global npm@10.9.2
      - name: Verify toolchain
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: |
          if npm ci --no-audit --no-fund; then
            echo "npm ci completed"
          else
            echo "::warning::npm ci failed before project validation; retrying via npm install and enforcing zero lockfile drift"
            npm install --no-audit --no-fund
            git diff --exit-code -- package-lock.json
          fi
      - name: Run full repository validation
        run: npm run validate
      - name: Audit production dependencies
        run: npm audit --omit=dev
